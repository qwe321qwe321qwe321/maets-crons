name: Keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling each workflow via the API resets that timer without needing dummy commits.
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable all workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id'); do
            gh api -X PUT "repos/$REPO/actions/workflows/$id/enable"
            echo "enabled $id"
          done
